<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Net Flow Provider</title>
    <link href="../css/output.css" rel="stylesheet" />
    <link
      rel="shortcut icon"
      href="../assets/images/logo.svg"
      type="image/x-icon" />
    <script type="module" src="js/index.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet" />
  </head>
  <body data-page="transactions">
    <div
      id="page-loader"
      class="fixed inset-0 z-100 bg-base-100 flex items-center justify-center">
      <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>
    <div class="drawer lg:drawer-open">
      <input id="my-drawer-4" type="checkbox" class="drawer-toggle" />

      <div class="drawer-content flex flex-col">
        <div>
          <nav-bar-provider
            data-crumbs='[
      {"label": "NetFlow", "url": "../index.html"},  
      {"label": "Transaksi", "url": null}
    ]'></nav-bar-provider>

          <main class="p-8 lg:p-12 flex-grow bg-base-100 flex flex-col gap-8">
            <!-- Header -->
            <section>
              <h1 class="font-bold text-2xl">Pusat Transaksi</h1>
              <p class="text-base-content/60">
                Informasi mengenai transaksi dan pengaturan keuangan provider.
              </p>
            </section>

            <!-- Revenue Summary Grid -->
            <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div class="lg:col-span-2">
                <transaction-summary-card
                  mrr="142850000"
                  growth="+12.4"
                  subscriptions="4821"
                  arpu="29630"
                  churn="0.82">
                </transaction-summary-card>
              </div>
              <invoice-outstanding-card
                total="8210400"
                collected="75"
                past-due-30="5420000"
                past-due-31="2790000">
              </invoice-outstanding-card>
            </section>

            <!-- Payout & Billing Guide -->
            <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <payout-settings-card
                bank="BCA •••• 9921"
                frequency="Mingguan (Senin)"
                next-payout="16 Oktober 2024">
              </payout-settings-card>
              <billing-guide-card pdf-url="/assets/docs/billing-guide.pdf">
              </billing-guide-card>
            </section>

            <!-- Transaction Table -->
            <section>
              <transaction-table src="/api/transactions"></transaction-table>
            </section>
          </main>
        </div>
      </div>

      <div class="drawer-side is-drawer-close:overflow-visible z-50">
        <label
          for="my-drawer-4"
          aria-label="close sidebar"
          class="drawer-overlay"></label>

        <side-bar-provider
          class="h-full block"
          id="sidebar"></side-bar-provider>
      </div>
    </div>

    <script type="module" src="./js/pages/packages.js"></script>
  </body>
</html>
