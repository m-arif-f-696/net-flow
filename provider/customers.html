<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Net Flow Provider</title>
    <link href="../css/output.css" rel="stylesheet" />
    <link
      rel="shortcut icon"
      href="../assets/images/logo.svg"
      type="image/x-icon"
    />
    <script type="module" src="js/index.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="customers">
    <div
      id="page-loader"
      class="fixed inset-0 z-100 bg-base-100 flex items-center justify-center"
    >
      <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>
    <div class="drawer lg:drawer-open">
      <input id="my-drawer-4" type="checkbox" class="drawer-toggle" />

      <div class="drawer-content flex flex-col">
        <div>
          <nav-bar-provider
            data-crumbs='[
      {"label": "NetFlow", "url": "../index.html"},  
      {"label": "Pelanggan", "url": null}
    ]'
          ></nav-bar-provider>

          <main class="p-8 lg:p-12 flex-grow bg-base-100 flex flex-col gap-8">
            <notification-confirm></notification-confirm>

            <section>
              <h1 class="font-bold text-2xl text-base-content">
                Daftar Pelanggan
              </h1>
              <p class="text-base-content/80">
                Cek kondisi pelanggan anda secara real-time.
              </p>
            </section>

            <div class="space-y-8">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div
                  class="bg-base-100 p-6 rounded-xl shadow-sm border border-neutral/10 flex items-center justify-between"
                >
                  <div class="space-y-1">
                    <p
                      class="text-xs text-base-content/60 font-medium uppercase tracking-wider"
                    >
                      Active Users
                    </p>
                    <p class="text-3xl font-extrabold text-base-content">
                      12,482
                    </p>
                  </div>
                  <div class="flex flex-col items-end gap-2">
                    <span
                      class="material-symbols-outlined text-primary bg-primary/10 p-2 rounded-lg"
                      >person_check</span
                    >
                    <span
                      class="text-xs font-bold text-success bg-success/10 px-2 py-0.5 rounded-full"
                      >+12%</span
                    >
                  </div>
                </div>

                <div
                  class="bg-base-100 p-6 rounded-xl shadow-sm border border-neutral/10 flex items-center justify-between"
                >
                  <div class="space-y-1">
                    <p
                      class="text-xs text-base-content/60 font-medium uppercase tracking-wider"
                    >
                      Pending Installs
                    </p>
                    <p class="text-3xl font-extrabold text-base-content">148</p>
                  </div>
                  <div class="flex flex-col items-end">
                    <span
                      class="material-symbols-outlined text-warning bg-warning/10 p-2 rounded-lg"
                      >hourglass_empty</span
                    >
                  </div>
                </div>

                <div
                  class="bg-base-100 p-6 rounded-xl shadow-sm border border-neutral/10 flex items-center justify-between"
                >
                  <div class="space-y-1">
                    <p
                      class="text-xs text-base-content/60 font-medium uppercase tracking-wider"
                    >
                      Down Nodes
                    </p>
                    <p class="text-3xl font-extrabold text-base-content">24</p>
                  </div>
                  <div class="flex flex-col items-end">
                    <span
                      class="material-symbols-outlined text-error bg-error/10 p-2 rounded-lg"
                      >signal_disconnected</span
                    >
                  </div>
                </div>
              </div>
            </div>

            <div
              class="flex flex-wrap items-center justify-between gap-4 py-4 px-6 bg-base-200 rounded-2xl border border-neutral/10"
            >
              <div class="flex items-center gap-2">
                <button
                  class="px-5 py-2 rounded-full bg-primary text-primary-content font-semibold text-sm shadow-md transition-all active:scale-95"
                >
                  All Customers
                </button>
                <button
                  class="px-5 py-2 rounded-full hover:bg-base-100 text-base-content/70 font-semibold text-sm transition-all active:scale-95"
                >
                  Active
                </button>
                <button
                  class="px-5 py-2 rounded-full hover:bg-base-100 text-base-content/70 font-semibold text-sm transition-all active:scale-95"
                >
                  Suspended
                </button>
                <button
                  class="px-5 py-2 rounded-full hover:bg-base-100 text-base-content/70 font-semibold text-sm transition-all active:scale-95"
                >
                  Pending
                </button>
              </div>
              <div class="flex items-center gap-3">
                <button
                  class="flex items-center gap-2 px-4 py-2 border border-neutral/10 bg-base-100 rounded-lg text-sm font-medium hover:bg-base-200 transition-colors"
                >
                  <span class="material-symbols-outlined text-sm"
                    >filter_list</span
                  >
                  Advanced Filter
                </button>
                <button
                  class="flex items-center gap-2 px-4 py-2 border border-neutral/10 bg-base-100 rounded-lg text-sm font-medium hover:bg-base-200 transition-colors"
                >
                  <span class="material-symbols-outlined text-sm"
                    >download</span
                  >
                  Export CSV
                </button>
              </div>
            </div>

            <div
              class="bg-base-100 rounded-3xl overflow-hidden shadow-xl shadow-base-300/50 border border-neutral/10"
            >
              <table class="w-full text-left border-collapse">
                <thead class="bg-base-200/50">
                  <tr>
                    <th
                      class="px-6 py-5 text-[11px] font-bold text-base-content/60 uppercase tracking-widest"
                    >
                      Customer Profile
                    </th>
                    <th
                      class="px-6 py-5 text-[11px] font-bold text-base-content/60 uppercase tracking-widest"
                    >
                      Subscriber ID
                    </th>
                    <th
                      class="px-6 py-5 text-[11px] font-bold text-base-content/60 uppercase tracking-widest"
                    >
                      Address
                    </th>
                    <th
                      class="px-6 py-5 text-[11px] font-bold text-base-content/60 uppercase tracking-widest"
                    >
                      Plan & Tier
                    </th>
                    <th
                      class="px-6 py-5 text-[11px] font-bold text-base-content/60 uppercase tracking-widest"
                    >
                      Usage (24h)
                    </th>
                    <th
                      class="px-6 py-5 text-[11px] font-bold text-base-content/60 uppercase tracking-widest text-right"
                    >
                      Actions
                    </th>
                  </tr>
                </thead>

                <tbody class="divide-y divide-neutral/10">

                  ></tr>

                  <tr
                    is="customer-row"
                    name="Elena Rodriguez"

                    customer-id="NF-5541-QA"
                    address="221B Baker St, London"

                    speed="500 Mbps Up/Down"
                    usage="-- GB"
                    usage-pct="0"
                    img="https://lh3.googleusercontent.com/aida-public/AB6AXuCI1Au_XaRP-cK3tf5PJ6Cj-qNuGZEyl1Zy1580k1LmSWvS92bgjajswZV2FqStKXG6jluUNNuv9_cK68bbebdJHzBAgoRRSEv5iNQnK__RqEDYwDSnVwZhxtJIHnw1N35lilFm3OwiGYItW0P3CJyxnf4h2z_77BHUn19wGuahvsMFb5BL39NHSMh0KWwntTzfDK4LD2aEZVHYOE4mbbZjMJC3nzyU5CYVl0eJAw49qC9m0j6brE2GUQZdNIlGMldnuor5j81cI5QL"
                  ></tr>

                  <tr
                    is="customer-row"
                    name="David Chen"
                    status="Active"
                    customer-id="NF-9901-ZZ"
                    address="101 Silicon Valley Blvd, Palo Alto"
                    plan="Enterprise Dedicated"
                    speed="10 Gbps Managed"
                    usage="2,480 GB"
                    usage-pct="94"
                    img="https://lh3.googleusercontent.com/aida-public/AB6AXuC8887Q1qAh6MlBXchfUIdyuD0EzlRisaAWlEGcKt-_2aTHOml0cgIdoTGx25SPlhc3NvCL9HVe3LvH-ytEg0D7A0B2p5xSvxWpeN0GL6GDjxSsBxHT8D8X2yh2ur_mHu7R4XVzdMKEhuYDOKYUfTo7JLwPF9hb-Fj0aiKpswK_wuao5nxtlajMK5CNdLmUjIph93I58foEmemuinDlFvb7uhRbXgNwlj_u0ClZrvusC24Um5dgEG7hWcqXdXuATql-nzQdv0FKvu0p"
                  ></tr>
                </tbody>
              </table>

              <div
                class="px-6 py-4 bg-base-200/30 flex items-center justify-between border-t border-neutral/10"
              >
                <p class="text-xs font-medium text-base-content/60">
                  Showing
                  <span class="text-base-content font-bold">1-4</span> of
                  <span class="text-base-content font-bold">12,482</span>
                  customers
                </p>
                <div class="flex items-center gap-2">
                  <button
                    class="p-2 rounded-lg border border-neutral/10 bg-base-100 hover:bg-base-200 disabled:opacity-50"
                    disabled
                  >
                    <span class="material-symbols-outlined">chevron_left</span>
                  </button>
                  <button
                    class="w-8 h-8 rounded-lg bg-primary text-primary-content text-xs font-bold"
                  >
                    1
                  </button>
                  <button
                    class="w-8 h-8 rounded-lg hover:bg-base-200 text-xs font-bold text-base-content/70"
                  >
                    2
                  </button>
                  <button
                    class="w-8 h-8 rounded-lg hover:bg-base-200 text-xs font-bold text-base-content/70"
                  >
                    3
                  </button>
                  <span class="text-base-content/40 px-1">...</span>
                  <button
                    class="w-8 h-8 rounded-lg hover:bg-base-200 text-xs font-bold text-base-content/70"
                  >
                    42
                  </button>
                  <button
                    class="p-2 rounded-lg border border-neutral/10 bg-base-100 hover:bg-base-200"
                  >
                    <span class="material-symbols-outlined">chevron_right</span>
                  </button>
                </div>
              </div>
            </div>
          </main>
        </div>
      </div>

      <div class="drawer-side is-drawer-close:overflow-visible z-50">
        <label
          for="my-drawer-4"
          aria-label="close sidebar"
          class="drawer-overlay"
        ></label>

        <side-bar-provider
          class="h-full block"
          id="sidebar"
        ></side-bar-provider>
      </div>
    </div>

    <script type="module" src="./js/pages/packages.js"></script>
  </body>
</html>
