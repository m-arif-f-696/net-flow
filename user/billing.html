<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Net Flow</title>
    <link href="../css/output.css" rel="stylesheet" />
    <link
      rel="shortcut icon"
      href="../assets/images/logo.svg"
      type="image/x-icon"
    />
    <script type="module" src="js/index.js"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://app.sandbox.midtrans.com/snap/snap.js"
      data-client-key="Mid-client-oslgJXWjrdtW9_gm"
    ></script>
  </head>
  <body data-page="billing">
    <!-- Loading Screen -->
    <section id="page-loader">
      <div
        class="fixed inset-0 z-[999] bg-white flex flex-col items-center justify-center gap-4"
      >
        <span class="loading loading-ring loading-xl text-primary"></span>
        <p
          class="text-sm font-semibold text-primary tracking-widest uppercase animate-pulse"
        >
          Loading...
        </p>
      </div>
    </section>

    <notification-confirm></notification-confirm>

    <top-bar></top-bar>

    <main class="mt-24 px-6 space-y-8 pb-24">
      <!-- Hero Section: Total Tagihan -->
      <section
        class="relative overflow-hidden rounded-3xl bg-base-100 p-8 shadow-lg border border-base-300"
      >
        <div
          class="absolute -top-24 -right-24 w-64 h-64 bg-primary/10 rounded-full blur-3xl"
        ></div>
        <div class="relative z-10 space-y-4">
          <span
            class="text-xs font-bold uppercase tracking-[0.15em] text-primary block"
          >
            Tagihan yang perlu dibayar
          </span>
          <h1
            id="billing-hero-amount"
            class="text-5xl font-extrabold tracking-tighter text-base-content"
          >
            <span class="loading loading-dots loading-md text-primary"></span>
          </h1>
          <p class="text-sm text-base-content/50">
            Segera lunasi sebelum jatuh tempo.
          </p>
        </div>
      </section>

      <!-- Tagihan Pending -->
      <section class="space-y-4 pt-2">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-bold tracking-tight text-base-content">
            Tagihan Yang Harus Dibayar
          </h2>
          <span
            id="billing-total-due"
            class="text-sm font-bold text-warning"
          ></span>
        </div>
        <div id="billing-pending-list" class="space-y-3">
          <!-- Diisi billingController.js -->
        </div>
      </section>

      <!-- Riwayat Berhasil -->
      <section class="space-y-4 pt-2">
        <h2 class="text-xl font-bold tracking-tight text-base-content">
          Riwayat Transaksi Berhasil
        </h2>
        <div id="billing-settled-list" class="space-y-3">
          <!-- Diisi billingController.js -->
        </div>
      </section>
    </main>

    <nav-bar></nav-bar>

    <script type="module" src="js/pages/billing.js"></script>
  </body>
</html>
