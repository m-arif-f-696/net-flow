    <header
      class="fixed top-0 w-full z-50 bg-base-100/80 backdrop-blur-xl border-b border-base-300"
    >
      <div class="flex items-center px-4 h-16 w-full max-w-xl mx-auto">
        <a
          href="/user/market.html"
          class="text-primary hover:opacity-70 transition-opacity active:scale-95"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-6 h-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"
            />
          </svg>
        </a>
        <h1 class="ml-4 font-bold tracking-tight text-base-content text-lg">
          Detail Paket
        </h1>
      </div>
    </header>

    <main class="pt-20 px-4 max-w-xl mx-auto">
      <!-- 1. Header: nama provider + nama paket + harga -->
      <package-detail-header></package-detail-header>

      <!-- 2. Speed specs: download, upload, uptime -->
      <package-detail-specs></package-detail-specs>

      <!-- 3. Fitur/benefit paket -->
      <package-detail-benefits></package-detail-benefits>

      <!-- 4. Coverage area + status ketersediaan -->
      <package-detail-coverage></package-detail-coverage>

      <!-- 5. Info provider -->
      <package-detail-provider></package-detail-provider>
    </main>

    <!-- Bottom Action Bar -->
    <div
      class="fixed bottom-0 left-0 w-full bg-base-100/80 backdrop-blur-xl border-t border-base-300 px-6 py-4 pb-8 z-50"
    >
      <div class="max-w-xl mx-auto">
        <button
          id="btn-connect"
          class="w-full bg-primary text-primary-content font-extrabold py-4 rounded-full shadow-lg shadow-primary/20 active:scale-[0.98] transition-all"
        >
          Connect to this Network
        </button>
      </div>
    </div>
