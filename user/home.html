<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Net Flow — Home</title>
    <link href="../css/output.css" rel="stylesheet" />
    <link
      rel="shortcut icon"
      href="../assets/images/logo.svg"
      type="image/x-icon"
    />
    <script type="module" src="js/index.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body data-page="home">
    <!-- Loading Screen -->
    <section id="page-loader">
      <div
        class="fixed inset-0 z-[999] bg-white flex flex-col items-center justify-center gap-4"
      >
        <span class="loading loading-ring loading-xl text-primary"></span>
        <p
          class="text-sm font-semibold text-primary tracking-widest uppercase animate-pulse"
        >
          Loading...
        </p>
      </div>
    </section>

    <notification-confirm></notification-confirm>

    <!-- Top Header -->
    <top-bar></top-bar>

    <!-- Main Content -->
    <main class="mt-20 pb-28 px-5 space-y-6">
      <!-- Greeting & Network Status -->
      <section class="flex justify-between items-end pt-4">
        <div>
          <p
            class="text-primary text-[10px] uppercase tracking-[0.15em] font-semibold mb-1"
          >
            Welcome back
          </p>
          <h1 class="text-2xl font-bold tracking-tight text-base-content">
            Hello, <span id="user-name">Loading...</span>
          </h1>
        </div>
        <div
          class="flex items-center gap-2 bg-success/10 px-3 py-1.5 rounded-full border border-success/20"
        >
          <span
            class="flex h-2 w-2 rounded-full bg-success animate-pulse"
          ></span>
          <span class="text-xs font-bold text-success">ONLINE</span>
        </div>
      </section>

      <!-- Active Plan Card -->
      <subscription-carousel></subscription-carousel>

      <nearby-providers></nearby-providers>

      <recent-activity></recent-activity>
    </main>

    <!-- Bottom Navigation -->
    <nav-bar></nav-bar>

    <script type="module" src="js/pages/home.js"></script>
  </body>
</html>
